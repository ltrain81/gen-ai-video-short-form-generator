[project]
name = "shorts"
version = "2.0.0"
description = "AWS Shorts V2 backend services (API, ingest, tools)"
requires-python = ">=3.12"
dependencies = ["boto3>=1.40"]

[dependency-groups]
dev = ["pytest>=8", "moto[dynamodb,s3]>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shorts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
